<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<text x="0" y="20" font-size="15" font-weight="600" fill="#8b949e">Time saved versus stock SQLite (synthetic data, default settings)</text>
<line x1="380.0" y1="38" x2="380.0" y2="310" stroke="#8b949e" stroke-opacity="0.25"/>
<text x="380.0" y="328" font-size="11" fill="#8b949e" text-anchor="middle">0%</text>
<line x1="455.0" y1="38" x2="455.0" y2="310" stroke="#8b949e" stroke-opacity="0.25"/>
<text x="455.0" y="328" font-size="11" fill="#8b949e" text-anchor="middle">25%</text>
<line x1="530.0" y1="38" x2="530.0" y2="310" stroke="#8b949e" stroke-opacity="0.25"/>
<text x="530.0" y="328" font-size="11" fill="#8b949e" text-anchor="middle">50%</text>
<line x1="605.0" y1="38" x2="605.0" y2="310" stroke="#8b949e" stroke-opacity="0.25"/>
<text x="605.0" y="328" font-size="11" fill="#8b949e" text-anchor="middle">75%</text>
<line x1="680.0" y1="38" x2="680.0" y2="310" stroke="#8b949e" stroke-opacity="0.25"/>
<text x="680.0" y="328" font-size="11" fill="#8b949e" text-anchor="middle">100%</text>
<text x="370" y="59" font-size="12.5" fill="#8b949e" text-anchor="end">Read an 8 MB value stored back to front (from disk)</text>
<rect x="380" y="46" width="269.7" height="18" rx="3" fill="#3b82f6"/>
<text x="655.7" y="59" font-size="12" font-weight="600" fill="#8b949e">90%</text>
<text x="370" y="89" font-size="12.5" fill="#8b949e" text-anchor="end">Delete 8 MB values stored back to front (from disk)</text>
<rect x="380" y="76" width="269.1" height="18" rx="3" fill="#3b82f6"/>
<text x="655.1" y="89" font-size="12" font-weight="600" fill="#8b949e">90%</text>
<text x="370" y="119" font-size="12.5" fill="#8b949e" text-anchor="end">Delete half of the rows, 1 MB values</text>
<rect x="380" y="106" width="210.3" height="18" rx="3" fill="#3b82f6"/>
<text x="596.3" y="119" font-size="12" font-weight="600" fill="#8b949e">70%</text>
<text x="370" y="149" font-size="12.5" fill="#8b949e" text-anchor="end">Delete half of the rows, 256 KB values</text>
<rect x="380" y="136" width="182.1" height="18" rx="3" fill="#3b82f6"/>
<text x="568.1" y="149" font-size="12" font-weight="600" fill="#8b949e">61%</text>
<text x="370" y="179" font-size="12.5" fill="#8b949e" text-anchor="end">Read an 8 MB value in 32 KB pieces (from disk)</text>
<rect x="380" y="166" width="158.1" height="18" rx="3" fill="#3b82f6"/>
<text x="544.1" y="179" font-size="12" font-weight="600" fill="#8b949e">53%</text>
<text x="370" y="209" font-size="12.5" fill="#8b949e" text-anchor="end">Read an 8 MB value stored back to front (cached)</text>
<rect x="380" y="196" width="150.9" height="18" rx="3" fill="#3b82f6"/>
<text x="536.9" y="209" font-size="12" font-weight="600" fill="#8b949e">50%</text>
<text x="370" y="239" font-size="12.5" fill="#8b949e" text-anchor="end">Rewrite 20 x 256 KB values per transaction, new size</text>
<rect x="380" y="226" width="114.3" height="18" rx="3" fill="#3b82f6"/>
<text x="500.3" y="239" font-size="12" font-weight="600" fill="#8b949e">38%</text>
<text x="370" y="269" font-size="12.5" fill="#8b949e" text-anchor="end">Read a 256 KB value (cached)</text>
<rect x="380" y="256" width="93.9" height="18" rx="3" fill="#3b82f6"/>
<text x="479.9" y="269" font-size="12" font-weight="600" fill="#8b949e">31%</text>
<text x="370" y="299" font-size="12.5" fill="#8b949e" text-anchor="end">Rewrite 20 x 256 KB values per transaction, same size</text>
<rect x="380" y="286" width="81.3" height="18" rx="3" fill="#3b82f6"/>
<text x="467.3" y="299" font-size="12" font-weight="600" fill="#8b949e">27%</text>
<text x="0" y="346" font-size="11" fill="#8b949e">Median of 7 rounds in randomised order, NVMe, Linux 6.17, 4 KB pages, synchronous=FULL. Every bar shown has non-overlapping ranges.</text>
</svg>
